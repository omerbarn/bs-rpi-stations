<text x="348" y="100" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">GPIO pins (the wiring goes here)</text>
<rect x="96" y="191" width="117" height="108" rx="3" fill="#c0c4c8" stroke="#6b7280" stroke-width="1.5"/>
<text x="154.5" y="252.20000000000002" font-size="11" font-weight="400" fill="#374151" text-anchor="middle">Wi-Fi can</text>
<rect x="654" y="128" width="189" height="144" rx="2" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
<text x="744" y="209" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">Ethernet</text>
<rect x="672" y="299" width="171" height="126" rx="2" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="757.5" y="371" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">USB 3</text>
<rect x="672" y="452" width="171" height="126" rx="2" fill="#111827" stroke="#111827" stroke-width="1.5"/>
<text x="757.5" y="524" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">USB 2</text>
<rect x="127.5" y="569" width="81" height="54" rx="2" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
<text x="168.0" y="636" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">USB-C power</text>
<rect x="258" y="569" width="63" height="54" rx="2" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
<text x="289.5" y="636" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">HDMI 0</text>
<rect x="379.5" y="569" width="63" height="54" rx="2" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
<text x="411.0" y="636" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">HDMI 1</text>
<rect x="510" y="551" width="63" height="72" rx="3" fill="#111827" stroke="#111827" stroke-width="1.5"/>
<text x="541.5" y="636" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Audio jack</text>
<rect x="258" y="272" width="135" height="135" rx="3" fill="#d1d5db" stroke="#111827" stroke-width="1.5"/>
<rect x="250.79999999999998" y="264.79999999999995" width="149.4" height="149.4" rx="5" fill="none" stroke="#f59e0b" stroke-width="4"/>
<circle cx="325.5" cy="339.5" r="17" fill="#f59e0b"/>
<text x="325.5" y="345.5" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">1</text>
<rect x="447" y="281" width="108" height="126" rx="3" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
<rect x="439.8" y="273.79999999999995" width="122.39999999999999" height="140.4" rx="5" fill="none" stroke="#f59e0b" stroke-width="4"/>
<circle cx="501.0" cy="344.0" r="17" fill="#f59e0b"/>
<text x="501.0" y="350.0" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">2</text>
<rect x="591" y="452" width="54" height="54" rx="3" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
<rect x="583.8000000000001" y="444.8" width="68.39999999999999" height="68.39999999999999" rx="5" fill="none" stroke="#f59e0b" stroke-width="4"/>
<circle cx="618.0" cy="479.0" r="17" fill="#f59e0b"/>
<text x="618.0" y="485.0" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">3</text>
<text x="880" y="116" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Which heatsink where</text>
<circle cx="892" cy="142" r="12" fill="#f59e0b"/>
<text x="892" y="147" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">1</text>
<text x="912" y="147" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Biggest heatsink → the shiny metal</text>
<text x="912" y="164" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">square in the middle (the</text>
<text x="912" y="181" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">processor, says Broadcom). This is</text>
<text x="912" y="198" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">the one that matters most.</text>
<circle cx="892" cy="232" r="12" fill="#f59e0b"/>
<text x="892" y="237" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">2</text>
<text x="912" y="237" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Medium heatsink → the black</text>
<text x="912" y="254" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">rectangular chip right next to it</text>
<text x="912" y="271" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">(the memory).</text>
<circle cx="892" cy="305" r="12" fill="#f59e0b"/>
<text x="892" y="310" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">3</text>
<text x="912" y="310" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Small heatsink → the small black</text>
<text x="912" y="327" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">square chip just behind the USB</text>
<text x="912" y="344" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">ports (USB controller).</text>
<text x="912" y="383" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Any extra tiny one: optional, it</text>
<text x="912" y="400" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">isn't needed. Don't stick anything</text>
<text x="912" y="417" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">on the metal Wi-Fi can or on the</text>
<text x="912" y="434" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">pins.</text>
<text x="912" y="473" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Check the case lid still closes,</text>
<text x="912" y="490" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">and that no heatsink touches the</text>
<text x="912" y="507" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">GPIO pins or the jumper plugs.</text>
<text x="28" y="734" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Layout is a simplified guide, not to scale. Go by what the chips look like: big shiny square = 1, black rectangle beside it = 2, small black square by the USB ports = 3.</text>
</svg>