<text x="753.0" y="816" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">grandMA2 desk</text>
<text x="753.0" y="836" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">192.168.0.20 · telnet port 30000</text>
<rect x="968" y="790" width="184" height="64" rx="8" fill="#fff4e6" stroke="#e08a1e" stroke-width="2"/>
