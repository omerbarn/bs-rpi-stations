<path d="M273,262 L330,262 L330,140 L1095,140 L1095,500 L1010,500 L1010,440" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round" stroke-dasharray="10 6"/>
<circle cx="760" cy="140" r="13" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="760" y="145" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">4</text>
<text x="410" y="214" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Button end of each jumper</text>
<circle cx="422" cy="244" r="11" fill="#111827"/><text x="422" y="249" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="442" y="249" font-size="13" font-weight="400" fill="#374151" text-anchor="start">cut the plastic plug off</text>
<circle cx="422" cy="292" r="11" fill="#111827"/><text x="422" y="297" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="442" y="297" font-size="13" font-weight="400" fill="#374151" text-anchor="start">strip 5 mm of insulation</text>
