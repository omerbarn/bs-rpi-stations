<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1010" viewBox="0 0 1180 1010" font-family="Helvetica, Arial, sans-serif">
<rect x="1" y="1" width="1178" height="1008" rx="10" fill="#fff" stroke="#d1d5db"/>
<text x="28" y="40" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Spaceship jet (bs-rpi1): Pi and lit arcade button, pin by pin</text>
