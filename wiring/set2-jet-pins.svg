<line x1="878" y1="822" x2="968" y2="822" stroke="#0891b2" stroke-width="4"/><text x="923.0" y="814" font-size="11" font-weight="600" fill="#0891b2" text-anchor="middle">DMX</text>
<circle cx="52" cy="905" r="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="52" y="910" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">1</text>
<text x="74" y="910" font-size="14" font-weight="400" fill="#111827" text-anchor="start">Button microswitch COM  →  Pi pin 11 (GPIO 17)</text>
<circle cx="52" cy="935" r="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="52" y="940" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">2</text>
<text x="74" y="940" font-size="14" font-weight="400" fill="#111827" text-anchor="start">Button microswitch NO  →  Pi pin 9 (GND)</text>
<circle cx="612" cy="905" r="12" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><text x="612" y="910" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">3</text>
<text x="634" y="910" font-size="14" font-weight="400" fill="#111827" text-anchor="start">Button LED +  →  Pi pin 4 (5 V)</text>
<circle cx="612" cy="935" r="12" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="612" y="940" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">4</text>
<text x="634" y="940" font-size="14" font-weight="400" fill="#111827" text-anchor="start">Button LED −  →  Pi pin 6 (GND)</text>
<text x="40" y="978" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">COM and NO, never NC. No resistor: the Pi&#x27;s internal pull-up holds GPIO 17 high until the press joins it to GND. Button light stays dark? Swap wires 3 and 4.</text>
