<text x="40" y="868" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">Pin names from Jaycar&#x27;s XC4486 datasheet, printed on the board. RXI to RXO is the one-way 5 V to 3.3 V channel, made for exactly this job. Speaker: Pi&#x27;s 3.5 mm jack.</text>
