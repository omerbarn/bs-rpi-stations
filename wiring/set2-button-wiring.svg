<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="510" viewBox="0 0 1180 510" font-family="Helvetica, Arial, sans-serif"><rect x="1" y="1" width="1178" height="508" rx="10" fill="#fff" stroke="#d1d5db"/><text x="28" y="38" font-size="21" font-weight="700" fill="#111827">Set 2 · Button: wiring (spaceship jet lights)</text><text x="28" y="60" font-size="13" fill="#6b7280">Raspberry Pi 4 · lit arcade button · ethernet to the venue · no sound · settings file config-2-button.json</text><rect x="28" y="76" width="22" height="14" rx="3" fill="#e8f5ec" stroke="#2f9e55" stroke-width="2"/><text x="56" y="88" font-size="12" fill="#4b5563">GOT = bought at Jaycar 12 Nov</text><rect x="236" y="76" width="22" height="14" rx="3" fill="#fff4e6" stroke="#e08a1e" stroke-width="2"/><text x="264" y="88" font-size="12" fill="#4b5563">BUY</text><rect x="302" y="76" width="22" height="14" rx="3" fill="#eef0f3" stroke="#9aa3ae" stroke-width="2"/><text x="330" y="88" font-size="12" fill="#4b5563">on site</text><line x1="400" y1="83" x2="426" y2="83" stroke="#6b7280" stroke-width="3"/><text x="432" y="88" font-size="12" fill="#4b5563">240 V AC</text><line x1="500" y1="83" x2="526" y2="83" stroke="#d97706" stroke-width="3"/><text x="532" y="88" font-size="12" fill="#4b5563">5 V USB-C</text><line x1="606" y1="83" x2="632" y2="83" stroke="#2563eb" stroke-width="3"/><text x="638" y="88" font-size="12" fill="#4b5563">button / GPIO</text><line x1="737" y1="83" x2="763" y2="83" stroke="#059669" stroke-width="3"/><text x="769" y="88" font-size="12" fill="#4b5563">audio 3.5 mm</text><line x1="862" y1="83" x2="888" y2="83" stroke="#0891b2" stroke-width="3"/><text x="894" y="88" font-size="12" fill="#4b5563">ethernet</text><rect x="28" y="118" width="170" height="72" rx="8" fill="#eef0f3" stroke="#9aa3ae" stroke-width="2"/><text x="40" y="142" font-size="15" font-weight="700" fill="#1f2937">Wall socket</text><text x="40" y="162" font-size="12" fill="#4b5563">240 V venue outlet</text><text x="40" y="179" font-size="12" fill="#4b5563">(RCD at the venue)</text><rect x="258" y="118" width="210" height="72" rx="8" fill="#e8f5ec" stroke="#2f9e55" stroke-width="2"/><text x="270" y="142" font-size="15" font-weight="700" fill="#1f2937">Pi power supply</text><text x="270" y="162" font-size="12" fill="#4b5563">official 5.1 V 3 A USB-C</text><text x="270" y="179" font-size="12" fill="#4b5563">Jaycar XC9122</text><rect x="424" y="108" width="38" height="20" rx="10" fill="#2f9e55"/><text x="443.0" y="122" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">GOT</text><path d="M198,154 L258,154" fill="none" stroke="#6b7280" stroke-width="3" /><text x="228" y="146" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">240 V</text><rect x="528" y="110" width="240" height="120" rx="8" fill="#e8f5ec" stroke="#2f9e55" stroke-width="2"/><text x="540" y="134" font-size="15" font-weight="700" fill="#1f2937">Raspberry Pi 4 in case</text><text x="540" y="154" font-size="12" fill="#4b5563">Jaycar XC9100 (4 GB)</text><text x="540" y="171" font-size="12" fill="#4b5563">microSD 16–32 GB: system,</text><text x="540" y="188" font-size="12" fill="#4b5563">station.py, settings, mp3</text><text x="540" y="205" font-size="12" fill="#4b5563">pins · aux jack · ethernet</text><rect x="724" y="100" width="38" height="20" rx="10" fill="#2f9e55"/><text x="743.0" y="114" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">GOT</text><path d="M468,154 L528,154" fill="none" stroke="#d97706" stroke-width="3" /><text x="498" y="146" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">USB-C</text><rect x="888" y="110" width="270" height="72" rx="8" fill="#e8f5ec" stroke="#2f9e55" stroke-width="2"/><text x="900" y="134" font-size="15" font-weight="700" fill="#1f2937">Arcade button, red, lit</text><text x="900" y="154" font-size="12" fill="#4b5563">Jaycar SP0662 · 25 mm hole · spades</text><text x="900" y="171" font-size="12" fill="#4b5563">switch: COM + NO · light: 2 LED tabs</text><rect x="1114" y="100" width="38" height="20" rx="10" fill="#2f9e55"/><text x="1133.0" y="114" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">GOT</text><path d="M768,130 L888,130" fill="none" stroke="#2563eb" stroke-width="3" /><text x="828" y="122" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">GPIO 17 · pin 11</text><path d="M768,150 L888,150" fill="none" stroke="#111827" stroke-width="3" /><path d="M768,170 L888,170" fill="none" stroke="#d97706" stroke-width="3" /><text x="828" y="188" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">GND · pin 9</text><text x="828" y="202" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">LED · pin 4 + pin 6</text><rect x="888" y="240" width="270" height="72" rx="8" fill="#eef0f3" stroke="#9aa3ae" stroke-width="2"/><text x="900" y="264" font-size="15" font-weight="700" fill="#1f2937">Venue network switch</text><text x="900" y="284" font-size="12" fill="#4b5563">light/sound system listens for</text><text x="900" y="301" font-size="12" fill="#4b5563">UDP: SPACESHIP_JET_GO (placeholder)</text><path d="M700,230 L700,276 L888,276" fill="none" stroke="#0891b2" stroke-width="3" /><text x="790" y="268" font-size="11" font-weight="600" fill="#0891b2" text-anchor="middle">ethernet cable</text><rect x="528" y="276" width="150" height="64" rx="8" fill="#eef0f3" stroke="#9aa3ae" stroke-width="2"/><text x="540" y="300" font-size="15" font-weight="700" fill="#1f2937">(no speaker)</text><text x="540" y="320" font-size="12" fill="#4b5563">aux jack unused</text><text x="540" y="337" font-size="12" fill="#4b5563">unless a sound is added</text><text x="28" y="362" font-size="14" font-weight="700" fill="#111827">Notes</text><text x="28" y="382" font-size="12" fill="#374151" xml:space="preserve">• Press → the Pi sends one UDP message to the venue system, which changes the lights on the spaceship jet.</text><text x="28" y="400" font-size="12" fill="#374151" xml:space="preserve">• Button wiring: 2 female-to-female jumpers. Pi end: push onto pin 11 (GPIO 17) and pin 9 (GND). Button end: cut off the plug, strip 5 mm,</text><text x="28" y="418" font-size="12" fill="#374151" xml:space="preserve">  fold the bare wire double, crimp a 6.3 mm female spade, push onto the microswitch&#x27;s COM and NO tabs (not NC, not the 2 LED tabs). No resistor.</text><text x="28" y="436" font-size="12" fill="#374151" xml:space="preserve">• Light: 2 more crimped jumpers from the LED tabs to pin 4 (5 V) and pin 6 (GND). Dark? swap them (LED has a + side). Too dim on 5 V?</text><text x="28" y="454" font-size="12" fill="#374151" xml:space="preserve">  Use a 12 V DC plug pack + DC-socket-to-screw-terminal adapter on the LED tabs instead (Pi pins stay as they are).</text><text x="28" y="472" font-size="12" fill="#374151" xml:space="preserve">• UDP message, IP and port are placeholders until the venue tells us what its system listens for.</text></svg>