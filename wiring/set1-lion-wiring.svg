<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="590" viewBox="0 0 1180 590" font-family="Helvetica, Arial, sans-serif"><rect x="1" y="1" width="1178" height="588" rx="10" fill="#fff" stroke="#d1d5db"/><text x="28" y="38" font-size="21" font-weight="700" fill="#111827">Set 1 · Lion roar: wiring (ultrasonic sensor + speaker)</text><text x="28" y="60" font-size="13" fill="#6b7280">Raspberry Pi 4 · Jaycar XC4442 ultrasonic · XC4486 level converter · speaker on site · no network needed · config-1-lion.json</text><rect x="28" y="76" width="22" height="14" rx="3" fill="#e8f5ec" stroke="#2f9e55" stroke-width="2"/><text x="56" y="88" font-size="12" fill="#4b5563">GOT = bought at Jaycar 12 Nov</text><rect x="236" y="76" width="22" height="14" rx="3" fill="#fff4e6" stroke="#e08a1e" stroke-width="2"/><text x="264" y="88" font-size="12" fill="#4b5563">BUY</text><rect x="302" y="76" width="22" height="14" rx="3" fill="#eef0f3" stroke="#9aa3ae" stroke-width="2"/><text x="330" y="88" font-size="12" fill="#4b5563">on site</text><line x1="400" y1="83" x2="426" y2="83" stroke="#6b7280" stroke-width="3"/><text x="432" y="88" font-size="12" fill="#4b5563">240 V AC</text><line x1="500" y1="83" x2="526" y2="83" stroke="#d97706" stroke-width="3"/><text x="532" y="88" font-size="12" fill="#4b5563">5 V USB-C</text><line x1="606" y1="83" x2="632" y2="83" stroke="#2563eb" stroke-width="3"/><text x="638" y="88" font-size="12" fill="#4b5563">button / GPIO</text><line x1="737" y1="83" x2="763" y2="83" stroke="#059669" stroke-width="3"/><text x="769" y="88" font-size="12" fill="#4b5563">audio 3.5 mm</text><line x1="862" y1="83" x2="888" y2="83" stroke="#0891b2" stroke-width="3"/><text x="894" y="88" font-size="12" fill="#4b5563">ethernet</text><rect x="28" y="118" width="170" height="72" rx="8" fill="#eef0f3" stroke="#9aa3ae" stroke-width="2"/><text x="40" y="142" font-size="15" font-weight="700" fill="#1f2937">Wall socket</text><text x="40" y="162" font-size="12" fill="#4b5563">240 V venue outlet</text><text x="40" y="179" font-size="12" fill="#4b5563">(RCD at the venue)</text><rect x="258" y="118" width="210" height="72" rx="8" fill="#e8f5ec" stroke="#2f9e55" stroke-width="2"/><text x="270" y="142" font-size="15" font-weight="700" fill="#1f2937">Pi power supply</text><text x="270" y="162" font-size="12" fill="#4b5563">official 5.1 V 3 A USB-C</text><text x="270" y="179" font-size="12" fill="#4b5563">Jaycar XC9122</text><rect x="424" y="108" width="38" height="20" rx="10" fill="#2f9e55"/><text x="443.0" y="122" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">GOT</text><path d="M198,154 L258,154" fill="none" stroke="#6b7280" stroke-width="3" /><text x="228" y="146" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">240 V</text><rect x="528" y="110" width="240" height="120" rx="8" fill="#e8f5ec" stroke="#2f9e55" stroke-width="2"/><text x="540" y="134" font-size="15" font-weight="700" fill="#1f2937">Raspberry Pi 4 in case</text><text x="540" y="154" font-size="12" fill="#4b5563">Jaycar XC9100 (4 GB)</text><text x="540" y="171" font-size="12" fill="#4b5563">microSD 16–32 GB: system,</text><text x="540" y="188" font-size="12" fill="#4b5563">station.py, settings, mp3</text><text x="540" y="205" font-size="12" fill="#4b5563">pins · aux jack · ethernet</text><rect x="724" y="100" width="38" height="20" rx="10" fill="#2f9e55"/><text x="743.0" y="114" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">GOT</text><path d="M468,154 L528,154" fill="none" stroke="#d97706" stroke-width="3" /><text x="498" y="146" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">USB-C</text><rect x="888" y="110" width="270" height="84" rx="8" fill="#fff4e6" stroke="#e08a1e" stroke-width="2"/><text x="900" y="134" font-size="15" font-weight="700" fill="#1f2937">Logic level converter</text><text x="900" y="154" font-size="12" fill="#4b5563">Jaycar XC4486 (A$4.95)</text><text x="900" y="171" font-size="12" fill="#4b5563">turns the sensor&#x27;s 5 V Echo</text><text x="900" y="188" font-size="12" fill="#4b5563">into 3.3 V for the Pi</text><rect x="1114" y="100" width="38" height="20" rx="10" fill="#e08a1e"/><text x="1133.0" y="114" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">BUY</text><path d="M768,130 L888,130" fill="none" stroke="#d97706" stroke-width="3" /><text x="828" y="122" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">5 V · 3.3 V · GND</text><path d="M768,175 L888,175" fill="none" stroke="#2563eb" stroke-width="3" /><text x="828" y="192" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">GPIO 24 (Echo)</text><rect x="888" y="262" width="270" height="72" rx="8" fill="#e8f5ec" stroke="#2f9e55" stroke-width="2"/><text x="900" y="286" font-size="15" font-weight="700" fill="#1f2937">Ultrasonic sensor</text><text x="900" y="306" font-size="12" fill="#4b5563">Jaycar XC4442 · in the lion base,</text><text x="900" y="323" font-size="12" fill="#4b5563">aimed at visitors · fires under 1 m</text><rect x="1114" y="252" width="38" height="20" rx="10" fill="#2f9e55"/><text x="1133.0" y="266" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">GOT</text><path d="M1023,194 L1023,262" fill="none" stroke="#2563eb" stroke-width="3" /><text x="1031" y="234" font-size="11" font-weight="600" fill="#2563eb">Echo (5 V)</text><path d="M768,215 L840,215 L840,300 L888,300" fill="none" stroke="#2563eb" stroke-width="3" /><text x="848" y="230" font-size="11" font-weight="600" fill="#2563eb">5 V · GND ·</text><text x="848" y="244" font-size="11" font-weight="600" fill="#2563eb">Trig GPIO 23</text><rect x="528" y="290" width="240" height="64" rx="8" fill="#eef0f3" stroke="#9aa3ae" stroke-width="2"/><text x="540" y="314" font-size="15" font-weight="700" fill="#1f2937">Speaker</text><text x="540" y="334" font-size="12" fill="#4b5563">on site (manager has it), next to</text><text x="540" y="351" font-size="12" fill="#4b5563">the lion · plays lion_roar.mp3</text><path d="M648,230 L648,290" fill="none" stroke="#059669" stroke-width="3" /><text x="585" y="266" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">3.5 mm aux cable (on site)</text><rect x="258" y="290" width="210" height="64" rx="8" fill="#eef0f3" stroke="#9aa3ae" stroke-width="2"/><text x="270" y="314" font-size="15" font-weight="700" fill="#1f2937">Wall socket</text><text x="270" y="334" font-size="12" fill="#4b5563">speaker power</text><text x="270" y="351" font-size="12" fill="#4b5563">(or USB if it&#x27;s a USB speaker)</text><path d="M468,322 L528,322" fill="none" stroke="#6b7280" stroke-width="3" /><text x="498" y="314" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle">240 V</text><text x="28" y="392" font-size="14" font-weight="700" fill="#111827">8 female-to-female jumpers: every end pushes onto a pin (Pi, sensor and converter all have pins), no crimps</text><text x="28" y="416" font-size="12" fill="#374151"><tspan font-weight="700">1.</tspan> Sensor VCC → Pi 5 V (pin 2)</text><text x="313" y="416" font-size="12" fill="#374151"><tspan font-weight="700">2.</tspan> Sensor GND → Pi GND (pin 6)</text><text x="598" y="416" font-size="12" fill="#374151"><tspan font-weight="700">3.</tspan> Sensor Trig → Pi GPIO 23 (pin 16)</text><text x="883" y="416" font-size="12" fill="#374151"><tspan font-weight="700">4.</tspan> Sensor Echo → Converter HV1</text><text x="28" y="438" font-size="12" fill="#374151"><tspan font-weight="700">5.</tspan> Converter LV1 → Pi GPIO 24 (pin 18)</text><text x="313" y="438" font-size="12" fill="#374151"><tspan font-weight="700">6.</tspan> Converter HV → Pi 5 V (pin 4)</text><text x="598" y="438" font-size="12" fill="#374151"><tspan font-weight="700">7.</tspan> Converter LV → Pi 3.3 V (pin 1)</text><text x="883" y="438" font-size="12" fill="#374151"><tspan font-weight="700">8.</tspan> Converter GND → Pi GND (pin 14)</text><text x="28" y="478" font-size="14" font-weight="700" fill="#111827">Notes</text><text x="28" y="498" font-size="12" fill="#374151" xml:space="preserve">• The sensor runs on 5 V and its Echo pin sends back 5 V. Pi pins only take 3.3 V, so Echo must go through the converter (or a 1k/2k resistor divider).</text><text x="28" y="516" font-size="12" fill="#374151" xml:space="preserve">• Trig can go straight to the Pi: 3.3 V from the Pi is enough to fire the sensor.</text><text x="28" y="534" font-size="12" fill="#374151" xml:space="preserve">• Person within 1 m → the speaker roars once; again only after they step away and 10 s have passed.</text><text x="28" y="552" font-size="12" fill="#374151" xml:space="preserve">• Male-to-female jumpers are only for the backup plan: a 1k/2k resistor divider on a mini breadboard instead of the converter.</text></svg>