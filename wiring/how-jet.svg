<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="Helvetica, Arial, sans-serif">
<rect x="1" y="1" width="1178" height="638" rx="10" fill="#fff" stroke="#d1d5db"/>
<text x="28" y="40" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Spaceship jet: how it works</text>
<text x="28" y="64" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Lit arcade button → Raspberry Pi → grandMA2 lighting desk → jet lights · settings in config-2-button.json · set the desk login with set-ma.sh</text>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<rect x="28.0" y="92" width="197.6" height="118" rx="10" fill="#eef0f3" stroke="#9aa3ae" stroke-width="2"/>
<circle cx="48.0" cy="114" r="11" fill="#9aa3ae"/><text x="48.0" y="119" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="66.0" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Visitor presses</text>
<text x="42.0" y="144" font-size="12" font-weight="400" fill="#374151" text-anchor="start">the lit red button</text>
<text x="42.0" y="161" font-size="12" font-weight="400" fill="#374151" text-anchor="start">(its light is always on)</text>
<line x1="229.6" y1="151.0" x2="255.60000000000002" y2="151.0" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="259.6" y="92" width="197.6" height="118" rx="10" fill="#e8f5ec" stroke="#2f9e55" stroke-width="2"/>
<circle cx="279.6" cy="114" r="11" fill="#2f9e55"/><text x="279.6" y="119" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="297.6" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Pi sees the press</text>
<text x="273.6" y="144" font-size="12" font-weight="400" fill="#374151" text-anchor="start">microswitch joins GPIO 17</text>
<text x="273.6" y="161" font-size="12" font-weight="400" fill="#374151" text-anchor="start">to GND · 50 ms debounce</text>
<line x1="461.20000000000005" y1="151.0" x2="487.20000000000005" y2="151.0" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="491.2" y="92" width="197.6" height="118" rx="10" fill="#e8f5ec" stroke="#2f9e55" stroke-width="2"/>
<circle cx="511.2" cy="114" r="11" fill="#2f9e55"/><text x="511.2" y="119" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="529.2" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Pi calls the desk</text>
<text x="505.2" y="144" font-size="12" font-weight="400" fill="#374151" text-anchor="start">telnet to 192.168.0.20:30000</text>
<text x="505.2" y="161" font-size="12" font-weight="400" fill="#374151" text-anchor="start">login &quot;administrator&quot; &quot;…&quot;</text>
<text x="505.2" y="178" font-size="12" font-weight="400" fill="#374151" text-anchor="start">Toggle Exec 130</text>
<line x1="692.8" y1="151.0" x2="718.8" y2="151.0" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="722.8" y="92" width="197.6" height="118" rx="10" fill="#eef0f3" stroke="#9aa3ae" stroke-width="2"/>
<circle cx="742.8" cy="114" r="11" fill="#9aa3ae"/><text x="742.8" y="119" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="760.8" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">grandMA2 desk</text>
<text x="736.8" y="144" font-size="12" font-weight="400" fill="#374151" text-anchor="start">toggles Executor 130</text>
<text x="736.8" y="161" font-size="12" font-weight="400" fill="#374151" text-anchor="start">one press on,</text>
<text x="736.8" y="178" font-size="12" font-weight="400" fill="#374151" text-anchor="start">the next press off</text>
<line x1="924.4" y1="151.0" x2="950.4" y2="151.0" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="954.4" y="92" width="197.6" height="118" rx="10" fill="#fff4e6" stroke="#e08a1e" stroke-width="2"/>
<circle cx="974.4" cy="114" r="11" fill="#e08a1e"/><text x="974.4" y="119" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="992.4" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Jet lights change</text>
<text x="968.4" y="144" font-size="12" font-weight="400" fill="#374151" text-anchor="start">the spaceship jet</text>
<text x="968.4" y="161" font-size="12" font-weight="400" fill="#374151" text-anchor="start">lighting cue runs</text>
<text x="28" y="250" font-size="15" font-weight="700" fill="#111827" text-anchor="start">Example: what the code does with five presses</text>
<text x="140" y="290" font-size="11" font-weight="700" fill="#2563eb" text-anchor="end">button held</text>
<text x="140" y="348" font-size="11" font-weight="700" fill="#e08a1e" text-anchor="end">command sent</text>
<rect x="150" y="272" width="1000" height="26" fill="#f9fafb" stroke="#e5e7eb"/>
<rect x="150" y="330" width="1000" height="26" fill="#f9fafb" stroke="#e5e7eb"/>
<rect x="200.0" y="275" width="75.0" height="20" rx="4" fill="#2563eb"/>
<rect x="350.0" y="275" width="15.0" height="20" rx="4" fill="#2563eb"/>
<rect x="550.0" y="275" width="15.0" height="20" rx="4" fill="#2563eb"/>
<rect x="600.0" y="275" width="10.0" height="20" rx="4" fill="#2563eb"/>
<rect x="875.0" y="275" width="15.0" height="20" rx="4" fill="#2563eb"/>
<line x1="200.0" y1="298" x2="200.0" y2="330" stroke="#e08a1e" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="200.0" y="333" width="12" height="20" rx="3" fill="#f59e0b"/>
<text x="218.0" y="348" font-size="11" font-weight="700" fill="#92400e" text-anchor="start">Toggle → lights ON</text>
<line x1="550.0" y1="298" x2="550.0" y2="330" stroke="#e08a1e" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="550.0" y="333" width="12" height="20" rx="3" fill="#f59e0b"/>
<text x="568.0" y="348" font-size="11" font-weight="700" fill="#92400e" text-anchor="start">Toggle → lights OFF</text>
<line x1="875.0" y1="298" x2="875.0" y2="330" stroke="#e08a1e" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="875.0" y="333" width="12" height="20" rx="3" fill="#f59e0b"/>
<text x="893.0" y="348" font-size="11" font-weight="700" fill="#92400e" text-anchor="start">Toggle → lights ON</text>
<text x="354.0" y="316" font-size="10" font-weight="600" fill="#9ca3af" text-anchor="start">ignored (cooldown)</text>
<text x="604.0" y="316" font-size="10" font-weight="600" fill="#9ca3af" text-anchor="start">ignored (cooldown)</text>
<text x="210.0" y="266" font-size="10" font-weight="600" fill="#2563eb" text-anchor="start">held 1.5 s: still one command</text>
<line x1="150.0" y1="362" x2="150.0" y2="367" stroke="#9ca3af"/><text x="150.0" y="380" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">0 s</text>
<line x1="250.0" y1="362" x2="250.0" y2="367" stroke="#9ca3af"/><text x="250.0" y="380" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">2 s</text>
<line x1="350.0" y1="362" x2="350.0" y2="367" stroke="#9ca3af"/><text x="350.0" y="380" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">4 s</text>
<line x1="450.0" y1="362" x2="450.0" y2="367" stroke="#9ca3af"/><text x="450.0" y="380" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">6 s</text>
<line x1="550.0" y1="362" x2="550.0" y2="367" stroke="#9ca3af"/><text x="550.0" y="380" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">8 s</text>
<line x1="650.0" y1="362" x2="650.0" y2="367" stroke="#9ca3af"/><text x="650.0" y="380" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">10 s</text>
<line x1="750.0" y1="362" x2="750.0" y2="367" stroke="#9ca3af"/><text x="750.0" y="380" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">12 s</text>
<line x1="850.0" y1="362" x2="850.0" y2="367" stroke="#9ca3af"/><text x="850.0" y="380" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">14 s</text>
<line x1="950.0" y1="362" x2="950.0" y2="367" stroke="#9ca3af"/><text x="950.0" y="380" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">16 s</text>
<line x1="1050.0" y1="362" x2="1050.0" y2="367" stroke="#9ca3af"/><text x="1050.0" y="380" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">18 s</text>
<line x1="1150.0" y1="362" x2="1150.0" y2="367" stroke="#9ca3af"/><text x="1150.0" y="380" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">20 s</text>
<circle cx="38" cy="439" r="5" fill="#e08a1e"/>
<text x="52" y="444" font-size="13" fill="#374151"><tspan font-weight="700">One press = one command.</tspan> Holding the button down doesn&#x27;t repeat it; the button has to be let go first.</text>
<circle cx="38" cy="467" r="5" fill="#e08a1e"/>
<text x="52" y="472" font-size="13" fill="#374151"><tspan font-weight="700">Cooldown.</tspan> Presses less than cooldown_s = 5 s after the last command are ignored, so kids hammering it can&#x27;t flicker the lights.</text>
<circle cx="38" cy="495" r="5" fill="#e08a1e"/>
<text x="52" y="500" font-size="13" fill="#374151"><tspan font-weight="700">Toggle.</tspan> The desk flips Executor 130 each time, so presses alternate the jet lights on and off.</text>
<circle cx="38" cy="523" r="5" fill="#e08a1e"/>
<text x="52" y="528" font-size="13" fill="#374151"><tspan font-weight="700">Desk unreachable?</tspan> The Pi logs &quot;MA2 command failed&quot; and keeps listening for the next press; it never needs a restart.</text>
<text x="28" y="578" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start">The command line is the same as the venue&#x27;s existing MA button: log in, send one line, hang up. Change it with ./set-ma.sh, e.g. a Go+ instead of a Toggle.</text>
<text x="28" y="604" font-size="11" font-weight="400" fill="#9ca3af" text-anchor="start">Timeline computed with the same rules and settings as station.py · watch it live: ssh pi@bs-rpi1.local journalctl -u station -f</text>
</svg>