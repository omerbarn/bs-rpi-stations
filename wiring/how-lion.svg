<text x="28" y="40" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Lion: how it works</text>
<text x="28" y="64" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Ultrasonic sensor in the lion base → Raspberry Pi → speaker · settings in config-1-lion.json · no network needed</text>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
