<text x="66.0" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Visitor walks up</text>
<text x="42.0" y="144" font-size="12" font-weight="400" fill="#374151" text-anchor="start">someone comes within</text>
<text x="42.0" y="161" font-size="12" font-weight="400" fill="#374151" text-anchor="start">1.5 m of the lion</text>
