<circle cx="38" cy="561" r="5" fill="#e08a1e"/>
<text x="52" y="566" font-size="13" fill="#374151"><tspan font-weight="700">New visitor → roar straight away.</tspan> Someone counts as new once nobody has been inside 1.5 m for clear_s = 0.5 s (so one missed sensor reading doesn&#x27;t count as leaving).</text>
<circle cx="38" cy="589" r="5" fill="#e08a1e"/>
<text x="52" y="594" font-size="13" fill="#374151"><tspan font-weight="700">Visitor stays → roar again.</tspan> Another roar repeat_s = 5 s after the last one finishes, for as long as they stay.</text>
<circle cx="38" cy="617" r="5" fill="#e08a1e"/>
<text x="52" y="622" font-size="13" fill="#374151"><tspan font-weight="700">Never two at once.</tspan> No new roar while one is playing, and at least cooldown_s = 5 s between the starts of two roars.</text>
<circle cx="38" cy="645" r="5" fill="#e08a1e"/>
<text x="52" y="650" font-size="13" fill="#374151"><tspan font-weight="700">Walks away mid-roar →</tspan> the roar plays to the end; the next person gets a fresh roar as soon as the speaker is free.</text>
<text x="28" y="684" font-size="11" font-weight="400" fill="#9ca3af" text-anchor="start">Timeline computed with the same rules and settings as station.py · roar length 10 s · live readings: set &quot;debug&quot;: true in config.json and run journalctl -u station -f</text>
