<text x="355.5" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Sensor measures</text>
<text x="331.5" y="144" font-size="12" font-weight="400" fill="#374151" text-anchor="start">pings 20× a second, Echo</text>
<text x="331.5" y="161" font-size="12" font-weight="400" fill="#374151" text-anchor="start">comes back through the</text>
<text x="331.5" y="178" font-size="12" font-weight="400" fill="#374151" text-anchor="start">level converter (5 V → 3.3 V)</text>
<line x1="577.0" y1="151.0" x2="603.0" y2="151.0" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="607.0" y="92" width="255.5" height="118" rx="10" fill="#e8f5ec" stroke="#2f9e55" stroke-width="2"/>
<circle cx="627.0" cy="114" r="11" fill="#2f9e55"/><text x="627.0" y="119" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="645.0" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Pi decides</text>
<text x="621.0" y="144" font-size="12" font-weight="400" fill="#374151" text-anchor="start">station.py checks the rules</text>
<text x="621.0" y="161" font-size="12" font-weight="400" fill="#374151" text-anchor="start">below: new visitor, still</text>
<text x="621.0" y="178" font-size="12" font-weight="400" fill="#374151" text-anchor="start">roaring, waited long enough?</text>
<line x1="866.5" y1="151.0" x2="892.5" y2="151.0" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="896.5" y="92" width="255.5" height="118" rx="10" fill="#fff4e6" stroke="#e08a1e" stroke-width="2"/>
<circle cx="916.5" cy="114" r="11" fill="#e08a1e"/><text x="916.5" y="119" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="934.5" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Lion roars</text>
<text x="910.5" y="144" font-size="12" font-weight="400" fill="#374151" text-anchor="start">lion_roar.mp3 (10 s) plays</text>
<text x="910.5" y="161" font-size="12" font-weight="400" fill="#374151" text-anchor="start">from the 3.5 mm jack</text>
<text x="910.5" y="178" font-size="12" font-weight="400" fill="#374151" text-anchor="start">to the speaker</text>
